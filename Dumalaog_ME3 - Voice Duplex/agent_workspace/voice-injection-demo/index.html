<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Injection Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="rainbow-bar"></div>

  <main class="card">
    <h1>🎙️ Voice Injection Demo</h1>
    <p class="subtitle">Type something and inject it straight into your speakers.</p>

    <label for="text">Text to speak</label>
    <textarea id="text" rows="3">Hello! This is a tiny voice injection demo. Pick a voice, crank the pitch, and hit inject!</textarea>

    <div class="controls">
      <div class="control">
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div class="control">
        <label for="rate">Rate: <span id="rateVal">1.0</span></label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" />
      </div>
      <div class="control">
        <label for="pitch">Pitch: <span id="pitchVal">1.0</span></label>
        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1" />
      </div>
    </div>

    <div class="buttons">
      <button id="inject" class="btn primary">🚀 Inject Voice</button>
      <button id="stop" class="btn">⏹ Stop</button>
    </div>

    <div id="status" class="status" aria-live="polite">Ready. Voices load a moment after the page opens.</div>

    <div class="wave" id="wave" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </main>

  <footer class="foot">Runs 100% in your browser via the Web Speech API — no servers, no secrets.</footer>

  <script src="app.js"></script>
</body>
</html>
