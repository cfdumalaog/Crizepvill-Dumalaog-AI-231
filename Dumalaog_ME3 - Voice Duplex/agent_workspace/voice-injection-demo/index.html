<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Injection Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <main class="card">
    <h1>🎙️ Voice Injection Demo</h1>
    <p class="subtitle">Type a message, pick a voice, and inject it into the browser.</p>

    <label for="message">Message to inject</label>
    <textarea id="message" rows="3" placeholder="e.g. Hello! This is a voice injection.">Hello! This is a voice injection.</textarea>

    <label for="voice">Voice</label>
    <select id="voice"></select>

    <div class="sliders">
      <div>
        <label for="pitch">Pitch: <span id="pitchVal">1</span></label>
        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1" />
      </div>
      <div>
        <label for="rate">Speed: <span id="rateVal">1</span></label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" />
      </div>
    </div>

    <button id="injectBtn" class="inject-btn">⚡ Inject Voice</button>

    <div class="meter" id="meter" aria-hidden="true">
      <div class="meter-fill" id="meterFill"></div>
    </div>

    <p class="status" id="status">Ready. Waiting for injection…</p>
  </main>

  <footer class="foot">Tiny demo • Web Speech API • No data leaves your browser</footer>

  <script src="app.js"></script>
</body>
</html>
