[Service]
# Reapply the safe external-speaker level whenever ME3 starts. The leading
# '-' keeps the service bootable on systems where PipeWire or this mixer is not
# available yet; WirePlumber persists the sink volume for later sessions.
ExecStartPre=-/usr/bin/wpctl set-mute @DEFAULT_AUDIO_SINK@ 0
ExecStartPre=-/usr/bin/wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.90
ExecStartPre=-/usr/bin/amixer -c Audio set PCM 90% unmute
