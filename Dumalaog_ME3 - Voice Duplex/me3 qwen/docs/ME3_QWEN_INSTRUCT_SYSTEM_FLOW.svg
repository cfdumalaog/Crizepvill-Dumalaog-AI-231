<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">ME3 Qwen Instruct full-duplex system process flow</title>
  <desc id="desc">A detailed architecture infographic showing audio capture on a Raspberry Pi, echo cancellation, Silero VAD, Qwen audio transcription, the streaming Qwen tool brain, MCP tools and guarded external channels, Qwen TTS, browser speaker playback, barge-in feedback, deployment transport, safety controls, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#10142a"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4b5fd"/>
    </marker>
    <style>
      .title{font:700 36px 'Segoe UI',Arial,sans-serif;fill:#f8fafc;letter-spacing:.4px}
      .subtitle{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}
      .section{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0;letter-spacing:1.3px;text-transform:uppercase}
      .box-title{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .box-kicker{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#bfdbfe;letter-spacing:1px;text-transform:uppercase}
      .body{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}
      .body-strong{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .small{font:400 11px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .tiny{font:400 10px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .code{font:500 11px 'Cascadia Mono','Consolas',monospace;fill:#bfdbfe}
      .pill{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#e0f2fe;letter-spacing:.3px}
      .flow{fill:none;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow-blue)}
      .backflow{fill:none;stroke:#f472b6;stroke-width:2.5;stroke-dasharray:8 7;stroke-linecap:round;marker-end:url(#arrow-purple)}
      .rule{stroke:#334155;stroke-width:1}
      .card{filter:url(#shadow);stroke-width:1.2}
      .input{fill:#0b2943;stroke:#2563eb}
      .local{fill:#0b302b;stroke:#10b981}
      .remote{fill:#241d4b;stroke:#8b5cf6}
      .tools{fill:#3a2910;stroke:#f59e0b}
      .output{fill:#0b3035;stroke:#14b8a6}
      .safe{fill:#351c2a;stroke:#fb7185}
      .neutral{fill:#121f35;stroke:#475569}
      .number{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#07111f}
    </style>
  </defs>

  <rect width="1800" height="1240" fill="url(#bg)"/>
  <rect x="24" y="22" width="1752" height="5" rx="2.5" fill="url(#head)"/>
  <text x="40" y="72" class="title">ME3 QWEN INSTRUCT</text>
  <text x="40" y="102" class="subtitle">Full-duplex voice agent on Raspberry Pi — continuous listening, interruptible speech, inference-first tools, and browser audio output</text>
  <text x="1760" y="72" text-anchor="end" class="pill">NO TRAINING REQUIRED</text>
  <text x="1760" y="101" text-anchor="end" class="small">Qwen audio providers + shared ToolBrain + locally owned MCP servers</text>

  <text x="40" y="140" class="section">01 · Live turn path</text>
  <text x="1760" y="140" text-anchor="end" class="small">PCM in → action → PCM out; the lower feedback path keeps the loop duplex</text>

  <!-- Main flow cards -->
  <g class="card input">
    <rect x="25" y="160" width="235" height="260" rx="16"/>
    <circle cx="51" cy="191" r="15" fill="#60a5fa"/><text x="51" y="197" text-anchor="middle" class="number">1</text>
    <text x="77" y="187" class="box-kicker">INPUT</text><text x="77" y="211" class="box-title">Pi microphone</text>
    <text x="45" y="246" class="body-strong">Fifine USB capture</text>
    <text x="45" y="268" class="body">• 16 kHz, 16-bit, mono PCM</text>
    <text x="45" y="288" class="body">• 30 ms frames / 480 samples</text>
    <text x="45" y="324" class="body-strong">Continuous listen</text>
    <text x="45" y="346" class="body">No push-to-talk or browser</text>
    <text x="45" y="365" class="body">voice-submit button is required.</text>
    <rect x="45" y="385" width="175" height="22" rx="11" fill="#173d63"/><text x="132" y="400" text-anchor="middle" class="pill">Filipino · English · Taglish</text>
  </g>

  <g class="card local">
    <rect x="278" y="160" width="235" height="260" rx="16"/>
    <circle cx="304" cy="191" r="15" fill="#34d399"/><text x="304" y="197" text-anchor="middle" class="number">2</text>
    <text x="330" y="187" class="box-kicker">LOCAL AUDIO CONTROL</text><text x="330" y="211" class="box-title">Echo guard + VAD</text>
    <text x="298" y="244" class="body-strong">Playback-reference cancellation</text>
    <text x="298" y="265" class="body">80 ms delay · 250 ms search</text>
    <text x="298" y="284" class="body">250 ms reflection tail · hard mute</text>
    <text x="298" y="318" class="body-strong">Silero VAD ONNX</text>
    <text x="298" y="339" class="body">threshold 0.5 · speech 120 ms</text>
    <text x="298" y="358" class="body">silence endpoint 800 ms</text>
    <text x="298" y="393" class="code">LISTENING ↔ SPEAKING ↔ INTERRUPTED</text>
  </g>

  <g class="card remote">
    <rect x="531" y="160" width="235" height="260" rx="16"/>
    <circle cx="557" cy="191" r="15" fill="#c4b5fd"/><text x="557" y="197" text-anchor="middle" class="number">3</text>
    <text x="583" y="187" class="box-kicker">QWEN AUDIO · REMOTE</text><text x="583" y="211" class="box-title">Speech recognition</text>
    <text x="551" y="247" class="body-strong">Qwen2-Audio-7B-Instruct</text>
    <text x="551" y="269" class="body">vLLM OpenAI-compatible endpoint</text>
    <text x="551" y="288" class="body">prompt: return transcript only</text>
    <text x="551" y="323" class="body-strong">Protected route</text>
    <text x="551" y="344" class="body">Pi → SSH reverse tunnel → VPN</text>
    <text x="551" y="363" class="body">DGX audio service, key in env only</text>
    <rect x="551" y="385" width="174" height="22" rx="11" fill="#3c2e78"/><text x="638" y="400" text-anchor="middle" class="pill">final transcript delta</text>
  </g>

  <g class="card remote">
    <rect x="784" y="160" width="235" height="260" rx="16"/>
    <circle cx="810" cy="191" r="15" fill="#c4b5fd"/><text x="810" y="197" text-anchor="middle" class="number">4</text>
    <text x="836" y="187" class="box-kicker">INFERENCE · STREAMING</text><text x="836" y="211" class="box-title">Qwen ToolBrain</text>
    <text x="804" y="247" class="body-strong">Qwen3.8-27B via vLLM</text>
    <text x="804" y="269" class="body">OpenAI-compatible direct stream</text>
    <text x="804" y="288" class="body">reasoning controls disabled</text>
    <text x="804" y="323" class="body-strong">Agent policy</text>
    <text x="804" y="344" class="body">short spoken replies · formal tone</text>
    <text x="804" y="363" class="body">Filipino/English/Taglish language mirror</text>
    <rect x="804" y="385" width="174" height="22" rx="11" fill="#3c2e78"/><text x="891" y="400" text-anchor="middle" class="pill">safe task progress only</text>
  </g>

  <g class="card tools">
    <rect x="1037" y="160" width="235" height="260" rx="16"/>
    <circle cx="1063" cy="191" r="15" fill="#fbbf24"/><text x="1063" y="197" text-anchor="middle" class="number">5</text>
    <text x="1089" y="187" class="box-kicker">MCP · ACTION LAYER</text><text x="1089" y="211" class="box-title">Plan, call, inspect</text>
    <text x="1057" y="245" class="body-strong">4 owned MCP servers</text>
    <text x="1057" y="266" class="body">ASR · TTS · VAD · tasks</text>
    <text x="1057" y="301" class="body-strong">23 bounded tools</text>
    <text x="1057" y="322" class="body">files · Python/commands · web</text>
    <text x="1057" y="341" class="body">webapps · timers · system/Git</text>
    <text x="1057" y="360" class="body">call/SMS/email with confirmation</text>
    <rect x="1057" y="385" width="175" height="22" rx="11" fill="#6b4b12"/><text x="1144" y="400" text-anchor="middle" class="pill">24 rounds + final summary</text>
  </g>

  <g class="card output">
    <rect x="1290" y="160" width="235" height="260" rx="16"/>
    <circle cx="1316" cy="191" r="15" fill="#2dd4bf"/><text x="1316" y="197" text-anchor="middle" class="number">6</text>
    <text x="1342" y="187" class="box-kicker">QWEN AUDIO · REMOTE</text><text x="1342" y="211" class="box-title">Speech synthesis</text>
    <text x="1310" y="247" class="body-strong">Qwen3-TTS CustomVoice</text>
    <text x="1310" y="269" class="body">12 Hz · 1.7B · 24 kHz PCM</text>
    <text x="1310" y="288" class="body">single voice: Aiden</text>
    <text x="1310" y="323" class="body-strong">One style instruction</text>
    <text x="1310" y="344" class="body">formal · neutral · professional</text>
    <text x="1310" y="363" class="body">same for replies/backchannels/announcements</text>
    <rect x="1310" y="385" width="175" height="22" rx="11" fill="#12535a"/><text x="1397" y="400" text-anchor="middle" class="pill">I am processing your request now.</text>
  </g>

  <g class="card output">
    <rect x="1543" y="160" width="232" height="260" rx="16"/>
    <circle cx="1569" cy="191" r="15" fill="#2dd4bf"/><text x="1569" y="197" text-anchor="middle" class="number">7</text>
    <text x="1595" y="187" class="box-kicker">OUTPUT · FEEDBACK</text><text x="1595" y="211" class="box-title">Browser speaker</text>
    <text x="1563" y="247" class="body-strong">Pi → WebSocket PCM</text>
    <text x="1563" y="268" class="body">browser audio tunnel on 8101</text>
    <text x="1563" y="287" class="body">connected PC speaker by default</text>
    <text x="1563" y="322" class="body-strong">While TTS plays</text>
    <text x="1563" y="343" class="body">user can speak over the agent</text>
    <text x="1563" y="362" class="body">barge-in stops, flushes, and resumes</text>
    <rect x="1563" y="385" width="173" height="22" rx="11" fill="#12535a"/><text x="1649" y="400" text-anchor="middle" class="pill">full-duplex loop closes</text>
  </g>

  <path d="M260 290 H270" class="flow"/>
  <path d="M513 290 H523" class="flow"/>
  <path d="M766 290 H776" class="flow"/>
  <path d="M1019 290 H1029" class="flow"/>
  <path d="M1272 290 H1282" class="flow"/>
  <path d="M1525 290 H1535" class="flow"/>
  <path d="M1659 420 C1659 475 130 475 130 420" class="backflow"/>
  <text x="900" y="470" text-anchor="middle" class="small" fill="#f9a8d4">barge-in / echo-protected feedback path: user speech interrupts playback; agent audio is not re-transcribed as a new user turn</text>

  <text x="40" y="520" class="section">02 · Deployment, safety, and observability layers</text>

  <g class="card neutral">
    <rect x="25" y="540" width="560" height="214" rx="16"/>
    <text x="50" y="575" class="box-title">Transport and deployment plane</text>
    <line x1="50" y1="592" x2="560" y2="592" class="rule"/>
    <text x="50" y="621" class="body-strong">Raspberry Pi runtime</text>
    <text x="50" y="642" class="body">`/home/dalmacio/Desktop/dandan` · HTTP 8126 · audio 8127</text>
    <text x="50" y="674" class="body-strong">Workstation browser</text>
    <text x="50" y="695" class="body">SSH local forwards: UI 8100 · audio 8101 · browser is the speaker sink</text>
    <text x="50" y="727" class="body-strong">Protected model route</text>
    <text x="50" y="748" class="body">Pi VPN → DGX direct; laptop reverse tunnel is optional fallback</text>
  </g>

  <g class="card safe">
    <rect x="620" y="540" width="560" height="214" rx="16"/>
    <text x="645" y="575" class="box-title">Safety and permission plane</text>
    <line x1="645" y1="592" x2="1155" y2="592" class="rule"/>
    <text x="645" y="621" class="body-strong">Conversation policy</text>
    <text x="645" y="642" class="body">formal customer service · AI disclosure · human handoff for sensitive cases</text>
    <text x="645" y="674" class="body-strong">External side effects</text>
    <text x="645" y="695" class="body">call/SMS/email require recipient/content preview and explicit confirmation</text>
    <text x="645" y="727" class="body-strong">Credentials and scope</text>
    <text x="645" y="748" class="body">protected environment variables · bounded tools · no raw chain-of-thought in UI</text>
  </g>

  <g class="card neutral">
    <rect x="1215" y="540" width="560" height="214" rx="16"/>
    <text x="1240" y="575" class="box-title">UI, telemetry, and benchmark plane</text>
    <line x1="1240" y1="592" x2="1750" y2="592" class="rule"/>
    <text x="1240" y="621" class="body-strong">Live UI</text>
    <text x="1240" y="642" class="body">variant badge · VAD/RMS · state · transcript/reply · sanitized tool feed</text>
    <text x="1240" y="674" class="body-strong">State endpoints</text>
    <text x="1240" y="695" class="body">`/api/health` · `/api/state` · model timings · turns · barge-ins · errors</text>
    <text x="1240" y="727" class="body-strong">Evidence boundary</text>
    <text x="1240" y="748" class="body">injected tests and service health are separate from a clean human Pi turn and paper FDB v1.5</text>
  </g>

  <text x="40" y="805" class="section">03 · One request, expanded into a turn timeline</text>
  <g>
    <line x1="80" y1="860" x2="1710" y2="860" stroke="#334155" stroke-width="3"/>
    <g transform="translate(80,0)"><circle cx="0" cy="860" r="13" fill="#60a5fa"/><text x="0" y="865" text-anchor="middle" class="number">1</text><text x="0" y="895" text-anchor="middle" class="body-strong">Capture</text><text x="0" y="916" text-anchor="middle" class="tiny">PCM frames</text></g>
    <g transform="translate(310,0)"><circle cx="0" cy="860" r="13" fill="#34d399"/><text x="0" y="865" text-anchor="middle" class="number">2</text><text x="0" y="895" text-anchor="middle" class="body-strong">Detect</text><text x="0" y="916" text-anchor="middle" class="tiny">VAD + endpoint</text></g>
    <g transform="translate(540,0)"><circle cx="0" cy="860" r="13" fill="#c4b5fd"/><text x="0" y="865" text-anchor="middle" class="number">3</text><text x="0" y="895" text-anchor="middle" class="body-strong">Transcribe</text><text x="0" y="916" text-anchor="middle" class="tiny">Qwen Audio</text></g>
    <g transform="translate(770,0)"><circle cx="0" cy="860" r="13" fill="#c4b5fd"/><text x="0" y="865" text-anchor="middle" class="number">4</text><text x="0" y="895" text-anchor="middle" class="body-strong">Plan</text><text x="0" y="916" text-anchor="middle" class="tiny">streaming LLM</text></g>
    <g transform="translate(1000,0)"><circle cx="0" cy="860" r="13" fill="#fbbf24"/><text x="0" y="865" text-anchor="middle" class="number">5</text><text x="0" y="895" text-anchor="middle" class="body-strong">Act</text><text x="0" y="916" text-anchor="middle" class="tiny">MCP tools</text></g>
    <g transform="translate(1230,0)"><circle cx="0" cy="860" r="13" fill="#2dd4bf"/><text x="0" y="865" text-anchor="middle" class="number">6</text><text x="0" y="895" text-anchor="middle" class="body-strong">Speak</text><text x="0" y="916" text-anchor="middle" class="tiny">Aiden TTS</text></g>
    <g transform="translate(1460,0)"><circle cx="0" cy="860" r="13" fill="#2dd4bf"/><text x="0" y="865" text-anchor="middle" class="number">7</text><text x="0" y="895" text-anchor="middle" class="body-strong">Play</text><text x="0" y="916" text-anchor="middle" class="tiny">browser speaker</text></g>
    <g transform="translate(1630,0)"><circle cx="0" cy="860" r="13" fill="#f472b6"/><text x="0" y="865" text-anchor="middle" class="number">↻</text><text x="0" y="895" text-anchor="middle" class="body-strong">Interrupt</text><text x="0" y="916" text-anchor="middle" class="tiny">flush / resume</text></g>
  </g>

  <g class="card tools">
    <rect x="25" y="965" width="850" height="220" rx="16"/>
    <text x="50" y="1000" class="box-title">What the Qwen agent can do through the tool layer</text>
    <line x1="50" y1="1017" x2="850" y2="1017" class="rule"/>
    <text x="50" y="1046" class="body">• Create/edit project files and websites; run bounded Python/commands and tests</text>
    <text x="50" y="1071" class="body">• Fetch/research web pages; start local web servers; inspect system and Git state</text>
    <text x="50" y="1096" class="body">• Set/list/cancel timers; use ME2-compatible actions; report progress safely in the UI</text>
    <text x="50" y="1121" class="body">• Prepare Telegram Bot API text and optional email behind protected credentials and confirmation gates</text>
    <text x="50" y="1152" class="small">Calendar events and Meet links are wired; Pi OAuth setup is pending. Gmail sending is not integrated. Browser sign-in grants no API access.</text>
    <text x="50" y="1170" class="small">External actions require a clear user request; Calendar OAuth and Telegram bot setup are pending. Browser sign-in alone grants no API access.</text>
  </g>

  <g class="card neutral">
    <rect x="910" y="965" width="865" height="220" rx="16"/>
    <text x="935" y="1000" class="box-title">Implementation map — the actual Qwen Instruct variant</text>
    <line x1="935" y1="1017" x2="1750" y2="1017" class="rule"/>
    <text x="935" y="1046" class="code">me3/agent.py</text><text x="1105" y="1046" class="body">continuous loop, states, barge-in, status server</text>
    <text x="935" y="1070" class="code">me3/audio_io.py</text><text x="1105" y="1070" class="body">PortAudio/remote mic, echo guard, browser PCM output</text>
    <text x="935" y="1094" class="code">me3/qwen_audio.py</text><text x="1105" y="1094" class="body">Qwen2-Audio ASR + Qwen3-TTS Aiden adapter</text>
    <text x="935" y="1118" class="code">me3/brain.py</text><text x="1105" y="1118" class="body">streaming ToolBrain, 24 rounds, no-tool final summary</text>
    <text x="935" y="1142" class="code">me3/mcp_*.py</text><text x="1105" y="1142" class="body">owned ASR/TTS/VAD/tasks MCP server wrappers</text>
    <text x="935" y="1166" class="code">scripts/me3_pi_server.py</text><text x="1208" y="1166" class="body">Pi HTTP + WebSocket server; ME2-style browser access</text>
  </g>

  <text x="40" y="1220" class="tiny">Current runtime labels: ME3 QWEN INSTRUCT · Qwen ASR: Qwen/Qwen2-Audio-7B-Instruct · LLM: Qwen/Qwen3.8-27B · TTS: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice / Aiden</text>
  <text x="1760" y="1220" text-anchor="end" class="tiny">System flow v1 · 2026-11-05 · implementation-grounded</text>
</svg>
