# ME3 - Voice Duplex: runtime configuration
# Single source of truth. All services read this.

deployment:
  target: rpi                    # rpi | dev (dev = run on this Windows box for testing)
  promotion_policy: workstation_acceptance_required
  rpi_user: dalmacio
  rpi_host: cfdfnjrpi5.local    # current mDNS name on the laptop hotspot; DHCP address can change
  rpi_hostkey_alias: 192.168.254.105 # verified against the previously trusted Pi host key
  rpi_path: /home/dalmacio/Desktop/dandan

# Filipino-market pilot profile. `fil` is ElevenLabs' language code for
# Filipino; English is the spoken default while Filipino and Taglish remain
# understood and can be mirrored when the user speaks them.
market:
  region: PH
  locale: fil-PH
  default_language: en
  supported_languages: [en, fil]
  code_switching: true
  use_case: customer_support_pilot

audio:
  sample_rate: 16000
  channels: 1
  frame_ms: 30                   # 480 samples @16k -> ~14.4k frames/s
  input_device: null             # null = default; set index/name for USB/I2S
  output_device: null
  full_duplex: true              # simultaneous capture + playback
  # Acoustic feedback guard. The speaker reference is matched against the
  # microphone frame and subtracted before Silero/Whisper. This preserves a
  # genuine user barge-in while preventing the agent's own voice from opening
  # a new turn. Keep enabled when using speakers; it is harmless with headset.
  echo_guard:
    enabled: true
    delay_ms: 80                  # expected speaker -> mic acoustic delay
    search_ms: 250                # compensate for device/room/buffer jitter
    search_step_ms: 5
    correlation_threshold: 0.20
    hard_gate_correlation: 0.75
    acoustic_hard_gate_correlation: 0.35
    acoustic_residual_ratio: 0.55
    transcript_suspect_residual_ratio: 0.80
    adaptive_taps_ms: [-60, -30, -15, 0, 15, 30, 60]
    digital_loopback_hard_mute: true # Stereo Mix carries only system output
    min_reference_rms: 80
    max_gain_db: 18
    tail_ms: 250                  # room reflections after playback stops

vad:
  model: silero_vad.onnx         # fetched at install
  threshold: 0.5
  min_speech_ms: 120
  min_silence_ms: 800            # endpointing: tolerate natural clause pauses
  window_ms: 30
  pre_roll_ms: 300               # keep audio before trigger for natural start

asr:
  engine: faster_whisper
  model: small                   # multilingual: tiny | base | small (Pi5=small, Pi4=base)
  compute_type: int8
  beam_size: 1                   # greedy for lowest latency
  language: null                 # auto-detect Filipino/English/Taglish
  vad_filter: false              # VAD handled by our silero stage, not whisper's

tts:
  engine: piper                # current profile uses one local voice; Qwen profile overrides this
  voice: en_GB-alba-medium       # standard ME3 response/announcer voice
  announcer_voice: en_GB-alba-medium # backchannels and completion announcements use this voice
  length_scale: 1.0
  sentence_split: true           # stream sentence-by-sentence for lower TTFB
  elevenlabs:
    api_key_env: ELEVENLABS_API_KEY
    voice_id_env: ELEVENLABS_VOICE_ID
    voice_id: ""                 # keep credentials/voice choice in the environment
    base_url: https://api.elevenlabs.io/v1
    model_id: eleven_flash_v2_5  # low-latency Filipino-capable model
    language_code: fil            # Filipino; choose a matching PH voice ID
    output_format: pcm_16000
    timeout_s: 30
    max_retries: 1              # bounded retry for timeout/429/5xx
    retry_backoff_s: 0.15

# Optional audio-model variant. It keeps local Silero VAD and the existing
# provider-neutral text ToolBrain, and swaps only ASR/TTS for the supplied
# DGX3 vLLM services. URLs and the shared key are runtime environment values.
variants:
  qwen_instruct:
    asr:
      engine: qwen_remote
      base_url_env: QWEN_INSTRUCT_ASR_BASE_URL
      model: Qwen/Qwen2-Audio-7B-Instruct
      api_key_env: QWEN_INSTRUCT_API_KEY
      protocol: chat_completions
      prompt: Transcribe the spoken audio exactly. Return only the transcript.
      max_tokens: 256
      timeout_s: 20                 # fail fast enough to keep the live UI responsive
      language: null
      fallback_engine_env: ME3_ASR_FALLBACK
      fallback_model_env: ME3_ASR_FALLBACK_MODEL
    tts:
      engine: qwen_remote
      base_url_env: QWEN_INSTRUCT_TTS_BASE_URL
      model: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      api_key_env: QWEN_INSTRUCT_API_KEY
      voice: aiden
      announcer_voice: aiden        # one standard Qwen response voice, including backchannels
      language: English
      instruct: >
        Use a formal, neutral, professional customer-service delivery with
        steady prosody. Avoid flirtatious, intimate, playful, suggestive, or
        overly familiar expression. Maintain the same professional tone for
        replies, backchannels, and completion announcements.
      sample_rate: 24000
      timeout_s: 60

llm:
  mode: remote                   # remote (vLLM) | openai (GPT-5.6 Luna) | local (ollama)
  default_provider: qwen         # qwen | luna; auto launch keeps Qwen first
  remote:
    base_url: http://202.92.159.240:8001/v1
    model: Qwen/Qwen3.8-27B
    api_key_env: VLLM_API_KEY
    temperature: 0.4
    max_tokens: 4096             # multi-tool turns (web-app builds) need room
    timeout_s: 180               # slow vLLM endpoint: allow long generations
    max_tool_steps: 24           # tool rounds per turn; final no-tool summary if exhausted
    history_messages: 16         # preserve enough context for multi-step voice actions
    stream: true                  # direct OpenAI-compatible token stream
    fast_mode: true               # voice path: skip Qwen hidden reasoning tokens
    thinking: false
    name: qwen-tools
  openai:
    base_url: https://api.openai.com/v1
    model: gpt-5.6-luna
    api_key_env: OPENAI_API_KEY
    reasoning_effort: null       # disabled for direct functional voice responses
    stream: true                  # direct OpenAI-compatible token stream
    temperature: null             # omit temperature for reasoning-model compatibility
    max_completion_tokens: 4096
    timeout_s: 90
    max_tool_steps: 24
    name: gpt-5.6-luna-medium-tools
  local:
    ollama_host: http://localhost:11434
    model: qwen2.5:3b            # Pi 5 only; Pi 4 -> remote mode

# External communication adapters. Values stay in the protected runtime
# environment; these names are documentation/configuration metadata only.
# Telegram Bot API text is the only active messaging/call-center channel in
# this project. Ordinary Telegram voice calls are not a Bot API capability.
# Resend email remains an optional independent adapter.
channels:
  telegram:
    base_url: https://api.telegram.org
    bot_token_env: TELEGRAM_BOT_TOKEN
  email:
    provider: resend
    base_url: https://api.resend.com
    api_key_env: RESEND_API_KEY
    from_email_env: RESEND_FROM_EMAIL

mcp:
  transport: stdio               # stdio (local) | streamable-http (network)
  servers:
    asr:
      cmd: python scripts/run_me3_module.py me3.mcp_asr
    tts:
      cmd: python scripts/run_me3_module.py me3.mcp_tts
    vad:
      cmd: python scripts/run_me3_module.py me3.mcp_vad
    tasks:
      cmd: python scripts/run_me3_module.py me3.mcp_tasks   # real-world task tools (timers, control, etc.)

agent:
  system_prompt: >
    You are a helpful, conversational voice assistant for a Philippines
    customer-support pilot running on a Raspberry Pi. Understand Filipino,
    English, and natural Taglish. Reply in English by default. If the user
    speaks Filipino or Taglish, mirror that language naturally; if the user
    explicitly requests a language, follow that request. Keep replies short
    (1-3 sentences) because they are spoken aloud.
    You are the ME3 full-duplex voice agent: the microphone remains live while
    you speak, echo protection rejects your own output, and genuine user
    speech can interrupt playback in automatic mode. The UI also provides a
    keyword-only protected-playback mode. If asked whether you are full or
    half duplex, answer that you are the ME3 full-duplex voice agent and
    briefly explain that ASR, reasoning, and TTS are separate internal stages
    while audio input and output remain simultaneous. Do not describe ME3 as
    half-duplex merely because those internal stages are sequential.
    Use a formal, professional customer-service tone: clear, respectful,
    concise, and interruptible. Do not flirt, tease, use intimate or suggestive
    language, use pet names, emojis, or laughter. Identify yourself as an AI
    assistant when asked; never impersonate a human agent. For uncertain,
    sensitive, financial, legal, medical, identity, or complaint-escalation
    issues, pause and offer a human handoff instead of guessing. Confirm
    actions briefly. For a clear ME2 command, always call its matching tool;
    never answer an actionable command with a generic readiness phrase. Route
    play music to play_music, questions/search/weather to web_search or
    get_weather, lights and dim/color to control_lights, timers to set_timer,
    alarms to set_alarm, thermostat changes to set_thermostat, media commands
    to media_control, reminders/lists to the reminder tools, and calls/messages
    to call_contact or send_message. You can use the project tools to create
    files, run tests, search the web, and build a webapp when the user asks.
    For Telegram text or
    email, first describe the recipient and content and ask for explicit user
    confirmation; only then set confirm=true. Ordinary voice calls are not
    available in Telegram Bot API mode. Never expose credentials, invent
    provider configuration, or claim a call/message/email succeeded unless the
    tool reports success. For a long-running task, use the exact acknowledgement
    "I am processing your request now." Use the recent conversation history:
    when your previous reply asks for missing details for an action, treat the
    user's next short utterance as the answer to that same action, not as a new
    greeting or unrelated request. For completion, state the result directly
    and professionally in one or two short sentences.
  barge_in: true                 # automatic echo-protected speech interruption
  command_control: true          # explicit stop, skip, and steer remain available
  protected_playback_ignore_noncontrol: true # fallback protection when barge-in is disabled
  command_min_speech_ms: 120
  command_min_silence_ms: 800
  turn_timeout_s: 12.0
  ack_wait_s: 2.5                # >0: speak a backchannel for long tool tasks (live); 0 = synchronous (bench protocol)
  history_messages: 16           # rolling user/assistant context sent to the brain
  backchannel: "I am processing your request now."
  web_port_default: 8000         # start_web_server default port

# FULL-DUPLEX-BENCH v1.5 overlap contract.  This is separate from the
# class latency benchmark below: it measures response category, stop latency,
# response latency, and pre/post-overlap adaptation across four scenarios.
fdb_v15:
  scenarios:
    - user_interruption
    - user_backchannel
    - talking_to_others
    - background_speech
  stimulus_counts:
    user_interruption: 200
    user_backchannel: 99
    talking_to_others: 100
    background_speech: 100
  response_categories:
    - RESPOND
    - RESUME
    - UNCERTAIN
    - UNKNOWN
  signal_transforms:
    talking_to_others:
      gain_db: -8
      high_shelf_hz: 4000
      high_shelf_db: -5
      reflections:
        - [0.045, -6]
        - [0.120, -12]
    background_speech:
      gain_db: -15
      lowpass_hz: 3000
      echo: [0.100, -10]
      dynamic_range_compression: true
  timing_equations:
    stop_latency_s: "tmodel_stop - tuser_start"
    response_latency_s: "tmodel_start - tuser_end"
  judge_model: gpt-4o-2024-08-06
  judge_prompt_source: refs/full-duplex-bench/v1_v1.5/evaluation/instruction/behavior.txt
  require_pre_post_audio: true

benchmark:
  n_trials: 20                   # per scenario
  class_target_ms:
    end_to_end: 4000             # class-group target: 4.0 s
    asr_final: 800               # class-group target: 0.8 s
    llm_ttft: 1500               # class-group target: 1.5 s
    tts_ttfb: 600                # class-group target: 0.6 s
    barge_in: 800                # class-group target: 0.8 s
  class_protocol:
    injected_audio_only: true
    open_microphone: false
    open_speaker: false
    disable_tool_calls: true
    disable_agent_calls: true
    disable_fillers_and_backchannels: true
  scenarios:
    - wake_to_first_word         # VAD trigger -> first TTS audio byte
    - utterance_to_llm_token     # ASR final -> first LLM token
    - llm_token_to_tts_audio     # first LLM token -> first TTS audio byte
    - end_to_end                 # user speech end -> agent first audio byte
    - barge_in                   # user interrupt -> agent TTS stop
  warmup: 3
  record: cpu_pct,ram_mb,frame_ms
